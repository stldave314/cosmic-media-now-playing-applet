name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# CI only reads the repository; never hand it a writable token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Third-party actions are pinned to commit SHAs so a moved tag can't
    # silently change what runs with our token (supply-chain hardening).
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          libexpat1-dev \
          libfontconfig-dev \
          libfreetype-dev \
          libxkbcommon-dev \
          libinput-dev \
          libgbm-dev \
          libseat-dev \
          libudev-dev \
          cmake \
          pkg-config

    - name: Rust Cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

    - name: Build
      run: cargo build --verbose --locked
    - name: Clippy (deny warnings)
      run: cargo clippy --all-features --locked -- -D warnings
    - name: Run tests
      run: cargo test --verbose --locked
