name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Built natively on each architecture rather than cross-compiled: libcosmic
    # needs a pile of system libraries (fontconfig, freetype, xkbcommon, gbm,
    # seat, udev …), and sourcing ARM64 versions of those on an x86_64 host is
    # far more fragile than just using an ARM64 runner. Free for public repos.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    name: release (${{ matrix.arch }})
    steps:
      # Third-party actions are pinned to commit SHAs so a moved tag can't
      # silently change what runs with our token (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libexpat1-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libinput-dev \
            libgbm-dev \
            libseat-dev \
            libudev-dev \
            cmake \
            pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Separate caches per architecture; artifacts aren't interchangeable.
          key: ${{ matrix.arch }}

      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build packages
        run: ./install.sh package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
          fail_on_unmatched_files: true
